name: FreeRDP Windows ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-11-arm
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout FreeRDP
        uses: actions/checkout@v4.2.2

      - name: Install dependencies via vcpkg
        run: |
          vcpkg install openssl:arm64-windows `
                        sdl2:arm64-windows `
                        sdl2-ttf:arm64-windows

      - name: Configure
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsarm64.bat"
          cmake -GNinja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_TOOLCHAIN_FILE="%VCPKG_INSTALLATION_ROOT%\scripts\buildsystems\vcpkg.cmake" ^
            -DVCPKG_TARGET_TRIPLET=arm64-windows ^
            -DWITH_SERVER=OFF ^
            -DWITH_SHADOW=OFF ^
            -DWITH_PROXY=OFF ^
            -DWITH_CUPS=OFF ^
            -DWITH_PULSE=OFF ^
            -DWITH_X11=OFF ^
            -DWITH_WAYLAND=OFF ^
            -B build

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsarm64.bat"
          cmake --build build --config Release

      - name: Collect artifacts
        shell: cmd
        run: |
          mkdir output
          copy build\client\Windows\Release\wfreerdp.exe output\ 2>nul
          copy build\client\SDL\Release\sdl-freerdp.exe output\ 2>nul
          xcopy /s /y build\*.dll output\ 2>nul
          dir output\

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: freerdp-windows-arm64
          path: output\
          retention-days: 7
