name: FreeRDP Windows ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-11-arm
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout FreeRDP
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1

      - name: Install dependencies via vcpkg
        run: |
          vcpkg install openssl:arm64-windows `
                        sdl2:arm64-windows `
                        sdl2-ttf:arm64-windows `
                        ffmpeg:arm64-windows `
                        libusb:arm64-windows

      - name: Configure
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsarm64.bat"
          cmake -GNinja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_TOOLCHAIN_FILE="%VCPKG_INSTALLATION_ROOT%\scripts\buildsystems\vcpkg.cmake" ^
            -DVCPKG_TARGET_TRIPLET=arm64-windows ^
            -DOPENSSL_ROOT_DIR="%VCPKG_INSTALLATION_ROOT%\installed\arm64-windows" ^
            -DWITH_SERVER=OFF ^
            -DWITH_SHADOW=OFF ^
            -DWITH_PROXY=OFF ^
            -DWITH_CUPS=OFF ^
            -DWITH_PULSE=OFF ^
            -DWITH_X11=OFF ^
            -DWITH_WAYLAND=OFF ^
            -B build

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsarm64.bat"
          cmake --build build --config Release

      - name: Collect artifacts
        shell: cmd
        run: |
          mkdir output
          mkdir output\ossl-modules

          copy build\client\Windows\cli\wfreerdp.exe output\
          copy build\client\SDL\SDL2\sdl-freerdp.exe output\
          copy build\client\Windows\wfreerdp-client3.dll output\
          copy build\client\common\freerdp-client3.dll output\
          copy build\client\common\libusb-1.0.dll output\
          copy build\client\SDL\SDL2\SDL2.dll output\
          copy build\client\SDL\SDL2\SDL2_ttf.dll output\
          copy build\client\SDL\SDL2\brotlicommon.dll output\
          copy build\client\SDL\SDL2\brotlidec.dll output\
          copy build\client\SDL\SDL2\bz2.dll output\
          copy build\client\SDL\SDL2\freetype.dll output\
          copy build\client\SDL\SDL2\libpng16.dll output\
          copy build\client\SDL\SDL2\z.dll output\
          xcopy /s /y build\libfreerdp\*.dll output\
          xcopy /s /y build\winpr\libwinpr\*.dll output\

          REM OpenSSL DLLs (needed on machines without vcpkg)
          copy "%VCPKG_INSTALLATION_ROOT%\installed\arm64-windows\bin\libssl-3-arm64.dll" output\
          copy "%VCPKG_INSTALLATION_ROOT%\installed\arm64-windows\bin\libcrypto-3-arm64.dll" output\

          REM Legacy provider for RC4 (required for RDP licensing)
          copy "%VCPKG_INSTALLATION_ROOT%\installed\arm64-windows\bin\legacy.dll" output\ossl-modules\

          REM openssl.cnf activating legacy provider
          (
            echo openssl_conf = openssl_init
            echo.
            echo [openssl_init]
            echo providers = provider_sect
            echo.
            echo [provider_sect]
            echo default = default_sect
            echo legacy = legacy_sect
            echo.
            echo [default_sect]
            echo activate = 1
            echo.
            echo [legacy_sect]
            echo activate = 1
          ) > output\openssl.cnf

          REM Launcher that sets OPENSSL_CONF and OPENSSL_MODULES before running sdl-freerdp
          (
            echo @echo off
            echo set "OPENSSL_CONF=%%~dp0openssl.cnf"
            echo set "OPENSSL_MODULES=%%~dp0ossl-modules"
            echo "%%~dp0sdl-freerdp.exe" %%*
          ) > output\sdl-freerdp.bat

          REM Same for wfreerdp
          (
            echo @echo off
            echo set "OPENSSL_CONF=%%~dp0openssl.cnf"
            echo set "OPENSSL_MODULES=%%~dp0ossl-modules"
            echo "%%~dp0wfreerdp.exe" %%*
          ) > output\wfreerdp.bat

          dir output\
          dir output\ossl-modules\

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: freerdp-windows-arm64
          path: output\
          retention-days: 7
